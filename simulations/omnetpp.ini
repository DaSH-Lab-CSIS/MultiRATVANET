# =============================================================================
# MultiRatVanet - application-driven multi-RAT (DSRC / WiFi / LTE / 5G-NR / 6G)
# handover scenario.
#
# Requirements (see README.md):
#   * OMNeT++ 5.6.x, INET 4.2.x, Veins 5.x + veins_inet, Simu5G 1.1.0 (built).
#   * SUMO + veins_launchd running (the SUMO scenario is reused from Simu5G's
#     NR/cars example via the relative launchConfig path below).
#
# This file layers the WiFi/DSRC + app-stack handover settings on top of the
# Simu5G LTE/5G-NR "cars" baseline. Sections at the bottom select the RAT
# selection policy for KPI comparison (Phase 8).
# =============================================================================
[General]
**.sameTransmissionStartTimeCheck = "ignore"
cmdenv-express-mode = true
cmdenv-autoflush = true
image-path = ../../../../Simu5G-1.1.0/Simu5G-1.1.0/images
# Default network (will be overridden by scenario configs)
network = multiratvanet.simulations.MultiRatHighway

debug-on-errors = false
print-undisposed = false
# Default sim time (overridden per scenario)
sim-time-limit = 70s

**.sctp.**.scalar-recording = false
**.sctp.**.vector-recording = false
**.routingRecorder.enabled = false

# Default playground (overridden per scenario)
*.playgroundSizeX = 20000m
*.playgroundSizeY = 20000m
*.playgroundSizeZ = 50m

##########################################################
#            Veins / SUMO manager                        #
##########################################################
*.veinsManager.host = "localhost"
*.veinsManager.port = 9999
*.veinsManager.moduleType = "multiratvanet.MultiRatCar"
*.veinsManager.moduleName = "car"
# Default: MultiRatHighway scenario (override with scenario-specific configs)
# Path is relative to the working directory (project root).
*.veinsManager.launchConfig = xmldoc("scenarios/highway/multiRatHighway.launchd.xml")
*.veinsManager.updateInterval = 0.1s
*.car[*].mobilityType = "VeinsInetMobility"

##########################################################
#              LTE / 5G-NR (from Simu5G baseline)        #
##########################################################
**.numBands = 25
**.ueTxPower = 26dBm
**.eNodeBTxPower = 46dBm
# Simu5G 1.7 moved these from the PHY to the RRC handover controller; on nrPhy they matched nothing.
*.car[*].cellularNic.rrc.nrHandoverController.dynamicCellAssociation = true
*.car[*].masterId = 0
*.car[*].macCellId = 0
*.car[*].nrMasterId = 1
*.car[*].nrMacCellId = 1
**.gNodeB1.macCellId = 1
**.gNodeB1.macNodeId = 1
**.gNodeB2.macCellId = 2
**.gNodeB2.macNodeId = 2
*.car[*].cellularNic.rrc.nrHandoverController.enableHandover = true
*.gNodeB*.cellularNic.phy.enableHandover = true
*.gNodeB*.cellularNic.phy.handoverLatency = 50ms
*.gNodeB*.cellInfo.broadcastMessageInterval = 1s
*.gNodeB*.numX2Apps = 1
*.gNodeB*.x2App[*].server.localPort = 5000 + ancestorIndex(1)
*.gNodeB1.x2App[0].client.connectAddress = "gNodeB2%x2ppp0"
*.gNodeB2.x2App[0].client.connectAddress = "gNodeB1%x2ppp0"
**.sctp.nagleEnabled = false
**.sctp.enableHeartbeats = false

##########################################################
#              WiFi / DSRC infrastructure positions      #
##########################################################
# APs and RSUs along the highway. The Veins frame maps the SUMO road (y~=100)
# to OMNeT y~=21..28 and x~=29..2020, so the roadside units sit at y=25m (on the
# track) with x spread along the 2 km road. Cars therefore drive in and out of
# each unit's coverage, exercising the DSRC/WiFi <-> LTE handover framework.
*.wifiAp[0].mobility.initialX = 400m
*.wifiAp[0].mobility.initialY = 25m
*.wifiAp[1].mobility.initialX = 1200m
*.wifiAp[1].mobility.initialY = 25m
*.wifiAp[*].mobility.initialZ = 0m
*.wifiAp[*].mobility.typename = "StationaryMobility"

*.dsrcRsu[0].mobility.initialX = 300m
*.dsrcRsu[0].mobility.initialY = 25m
*.dsrcRsu[1].mobility.initialX = 800m
*.dsrcRsu[1].mobility.initialY = 25m
*.dsrcRsu[2].mobility.initialX = 1400m
*.dsrcRsu[2].mobility.initialY = 25m
*.dsrcRsu[*].mobility.initialZ = 0m
*.dsrcRsu[*].mobility.typename = "StationaryMobility"

# StationaryMobility defaults initFromDisplayString=true, which would place the
# units at their NED @display("p=...") coordinate and ignore initialX/Y above.
# Disable it so the roadside units honour the coordinates set here.
*.wifiAp[*].mobility.initFromDisplayString = false
*.dsrcRsu[*].mobility.initFromDisplayString = false

# Distinct SSIDs so STAs associate to the right RAT.
*.wifiAp[*].wlan[*].mgmt.ssid = "wifi-net"
*.dsrcRsu[*].wlan[*].mgmt.ssid = "dsrc-net"
*.dsrcRsu[*].wlan[*].mgmt.beaconInterval = uniform(0.095s, 0.105s)
*.wifiAp[*].wlan[*].mgmt.beaconInterval = uniform(0.095s, 0.105s)
*.dsrcRsu[*].wlan[*].mgmt.beaconInterval = uniform(0.095s, 0.105s)
*.wifiAp[*].wlan[*].mgmt.beaconInterval = uniform(0.095s, 0.105s)

# Attach infrastructure radios to the correct medium.
*.wifiAp[*].wlan[*].radio.radioMediumModule = "wifiMedium"
*.dsrcRsu[*].wlan[*].radio.radioMediumModule = "dsrcMedium"

##########################################################
#              Vehicle WiFi/DSRC NICs                     #
##########################################################
# wlan[0] = DSRC (5.9 GHz), wlan[1] = WiFi (2.4 GHz). Both are STA-mode.
*.car[*].wlan[0].radio.radioMediumModule = "dsrcMedium"
*.car[*].wlan[0].radio.centerFrequency = 5.9GHz
*.car[*].wlan[0].radio.bandwidth = 10MHz
*.car[*].wlan[0].mgmt.typename = "Ieee80211MgmtSta"
*.car[*].wlan[0].agent.typename = "Ieee80211AgentSta"
*.car[*].wlan[0].agent.defaultSsid = "dsrc-net"

*.car[*].wlan[1].radio.radioMediumModule = "wifiMedium"
*.car[*].wlan[1].radio.centerFrequency = 2.412GHz
*.car[*].wlan[1].radio.bandwidth = 20MHz
*.car[*].wlan[1].mgmt.typename = "Ieee80211MgmtSta"
*.car[*].wlan[1].agent.typename = "Ieee80211AgentSta"
*.car[*].wlan[1].agent.defaultSsid = "wifi-net"

# The 802.11 radio antenna needs an explicit pointer to the host mobility
# module (INET does not auto-wire this for our manually added wlan NICs).
# Path from antenna: antenna -> radio -> wlan[k] -> host.mobility
*.car[*].wlan[*].radio.antenna.mobilityModule = "^.^.^.mobility"
*.wifiAp[*].wlan[*].radio.antenna.mobilityModule = "^.^.^.mobility"
*.dsrcRsu[*].wlan[*].radio.antenna.mobilityModule = "^.^.^.mobility"

##########################################################
#          RAT coverage monitor (range detection)        #
##########################################################
*.car[*].ratCoverageMonitor.updateInterval = 0.1s
*.car[*].ratCoverageMonitor.useDistance = true
*.car[*].ratCoverageMonitor.useSignal = true
*.car[*].ratCoverageMonitor.hasDsrc = true
*.car[*].ratCoverageMonitor.hasWifi = true
*.car[*].ratCoverageMonitor.hasLte  = true
*.car[*].ratCoverageMonitor.hasNr   = true
*.car[*].ratCoverageMonitor.hasSixG = false
*.car[*].ratCoverageMonitor.dsrcInfraType = "Rsu"       # matches DsrcRsu
*.car[*].ratCoverageMonitor.wifiInfraType = "WifiAp"    # matches WifiAp
*.car[*].ratCoverageMonitor.nrInfraType   = "gNodeB"
*.car[*].ratCoverageMonitor.lteInfraType  = ""          # LTE umbrella: always in range
*.car[*].ratCoverageMonitor.dsrcRange = 300m
*.car[*].ratCoverageMonitor.wifiRange = 200m
*.car[*].ratCoverageMonitor.nrRange   = 600m

##########################################################
#        Multi-RAT app manager (switching + KPIs)        #
##########################################################
*.car[*].multiRatAppManager.decisionInterval = 0.5s
*.car[*].multiRatAppManager.handoverExecDelay = 50ms
*.car[*].multiRatAppManager.pingPongWindow = 2s
*.car[*].multiRatAppManager.startTime = 2s
# Cars must not answer ARP for other hosts. INET enables proxy ARP everywhere by default, so a
# car with a cellular route to the server answered other cars' ARP for the server over
# DSRC/WiFi, got their uplink traffic and dropped it (forwarding is off on cars).
*.car[*].ipv4.arp.proxyArpInterfaces = ""
# NOTE: Simu5G 1.7 names the cellular NIC's IP interface "cellular" (Registration::
# registerInterface, parameter interfaceName); our INET 802.11 NICs are "wlan0" (DSRC) and "wlan1" (WiFi).
*.car[*].multiRatAppManager.dsrcInterface = "wlan0"
*.car[*].multiRatAppManager.wifiInterface = "wlan1"
*.car[*].multiRatAppManager.lteInterface  = "cellular"
*.car[*].multiRatAppManager.nrInterface   = "cellular"

##########################################################
#                    Traffic (data plane)                #
##########################################################
# Two traffic classes per car, both car -> server. Each follows whatever default
# route the manager has installed, so both ride the currently selected RAT.
#   safety:       200 B every 100 ms (10 Hz, like CAMs), must arrive within 100 ms
#   infotainment: 1250 B every 10 ms (1 Mbit/s) in bursts; on ~2 s, off ~3 s on
#                 average (exponential), so 0.4 Mbit/s per car over time; 1 s budget
*.server.numApps = 2
*.server.app[*].typename = "multiratvanet.MultiRatSink"
*.server.app[0].trafficClass = "safety"
*.server.app[0].localPort = 5000
*.server.app[0].deadline = 100ms
*.server.app[1].trafficClass = "infotainment"
*.server.app[1].localPort = 5001
*.server.app[1].deadline = 1s

*.car[*].numApps = 2
*.car[*].app[*].typename = "multiratvanet.MultiRatTrafficApp"
*.car[*].app[*].destAddress = "server"
*.car[*].app[*].startTime = 3s
*.car[*].app[0].trafficClass = "safety"
*.car[*].app[0].mode = "cbr"
*.car[*].app[0].destPort = 5000
*.car[*].app[0].messageLength = 200B
*.car[*].app[0].sendInterval = 100ms
*.car[*].app[1].trafficClass = "infotainment"
*.car[*].app[1].mode = "onoff"
*.car[*].app[1].destPort = 5001
*.car[*].app[1].messageLength = 1250B
*.car[*].app[1].sendInterval = 10ms
*.car[*].app[1].onTime = exponential(2s)
*.car[*].app[1].offTime = exponential(3s)

##########################################################
#                    Statistics                          #
##########################################################
*.car[*].multiRatAppManager.*.result-recording-modes = default
*.car[*].ratCoverageMonitor.*.result-recording-modes = default
*.car[*].app[*].**.result-recording-modes = default
**.scalar-recording = true
**.vector-recording = true


# ============================ MULTIRAT HIGHWAY SCENARIOS ==================== #
# Highway baseline: straight 2km road, 50 vehicles, 300s duration, minimal infrastructure.
# Baseline for policy comparison: highway conditions with sparse RSU/AP coverage.
# Configs: CoveragePriority (default), Ensemble, ML, Dense (80 vehicles)

[Config MultiRatHighway_Base]
description = "MultiRatHighway base: 2km straight road, 50 vehicles, 300s"
network = multiratvanet.simulations.MultiRatHighway
*.veinsManager.launchConfig = xmldoc("scenarios/highway/multiRatHighway.launchd.xml")
sim-time-limit = 300s
*.*.numCars = 50
*.playgroundSizeX = 20000m
*.playgroundSizeY = 20000m
*.playgroundSizeZ = 50m
*.car[*].ratCoverageMonitor.dsrcRange = 300m
*.car[*].ratCoverageMonitor.wifiRange = 200m
*.car[*].ratCoverageMonitor.nrRange = 600m
*.car[*].multiRatAppManager.decisionInterval = 0.5s

# Highway policy configs: extend from MultiRatHighway_Base
[Config CoveragePriority]
extends = MultiRatHighway_Base
description = "Highway: CoveragePriority RAT selection (DSRC>WiFi>NR>LTE)"
*.car[*].multiRatAppManager.policy = "CoveragePriority"

[Config Sinr]
extends = MultiRatHighway_Base
description = "Highway: Pick the in-range RAT with best signal quality"
*.car[*].multiRatAppManager.policy = "Sinr"

[Config LatencyQos]
extends = MultiRatHighway_Base
description = "Highway: Pick the in-range RAT meeting the latency budget with most capacity"
*.car[*].multiRatAppManager.policy = "LatencyQos"

[Config Load]
extends = MultiRatHighway_Base
description = "Highway: Balance load across in-range RATs"
*.car[*].multiRatAppManager.policy = "Load"

[Config Ml]
extends = MultiRatHighway_Base
description = "Highway: Hook for a learned / federated-learning controller"
*.car[*].multiRatAppManager.policy = "Ml"
*.car[*].multiRatAppManager.decisionInterval = 0.3s

[Config Ensemble]
extends = MultiRatHighway_Base
description = "Highway: Consult all base policies and elect the most-voted in-range RAT"
*.car[*].multiRatAppManager.policy = "Ensemble"
# Weighted voting: give each base policy a different say (0 disables a voter).
*.car[*].multiRatAppManager.ensembleWeightCoverage = 1.0
*.car[*].multiRatAppManager.ensembleWeightSinr     = 2.0
*.car[*].multiRatAppManager.ensembleWeightLatency  = 1.5
*.car[*].multiRatAppManager.ensembleWeightLoad     = 1.0
*.car[*].multiRatAppManager.ensembleStickiness     = 1.0

[Config Dense]
extends = MultiRatHighway_Base
description = "Highway dense: 80 vehicles on 2km road, high congestion"
*.*.numCars = 80
*.car[*].multiRatAppManager.ensembleStickiness = 1.5

[Config EnsembleSweep]
extends = Ensemble
description = "Highway: Sweep ensemble voter weights to study RAT-selection sensitivity"
# Grid over the SINR and latency voter weights (coverage/load fixed at 1.0).
# Runs = |sinr| x |latency| = 3 x 3 = 9. List runs with:  ./run.sh EnsembleSweep -q runs
# Stickiness is 0 here so the (weighted) vote strictly decides and the weights
# become observable in the handover KPIs.
*.car[*].multiRatAppManager.ensembleWeightCoverage = 1.0
*.car[*].multiRatAppManager.ensembleWeightSinr     = ${wsinr = 1.0, 2.0, 3.0}
*.car[*].multiRatAppManager.ensembleWeightLatency  = ${wlat = 1.0, 2.0, 3.0}
*.car[*].multiRatAppManager.ensembleWeightLoad     = 1.0
*.car[*].multiRatAppManager.ensembleStickiness     = 0.0


# ===================== V2I heterogeneous handover (DSRC <-> LTE) ============= #
# Classic heterogeneous-VANET handoff study: the vehicle uses short-range DSRC
# for V2I whenever it is within range of a roadside RSU, and hands the data flow
# over to wide-area LTE in the gaps between RSUs (LTE is the always-on umbrella).
# WiFi and 5G-NR are disabled so the switching is strictly DSRC <-> LTE, and each
# technology is given a realistic, distinct handover interruption time so the
# "average handover delay" KPI is meaningful:
#   * DSRC  : 100 ms  (802.11p channel scan + RSU association)
#   * LTE   :  40 ms  (default-route swap onto the already-attached bearer)
# KPIs of interest (per car, in results/*.sca):
#   handoversTotal, handoverDelayMean/Max/Total, handoverLatency:mean/max,
#   DSRC.selectionShare vs LTE.selectionShare, pingPongTotal.
[Config DsrcLteHandover]
extends = MultiRatHighway_Base
description = "Highway V2I heterogeneous handover: DSRC near RSU, LTE in gaps"

# Restrict the heterogeneous network to DSRC (V2I) + LTE (wide-area) only.
*.car[*].ratCoverageMonitor.hasWifi = false
*.car[*].ratCoverageMonitor.hasNr   = false

# Per-technology handover interruption times (make-before-break).
*.car[*].multiRatAppManager.dsrcHandoverDelay = 100ms
*.car[*].multiRatAppManager.lteHandoverDelay  = 40ms
# Re-evaluate a bit more often so RSU entry/exit is captured promptly.
*.car[*].multiRatAppManager.decisionInterval = 0.25s


# =============================== V2V (direct) ================================ #
# Direct vehicle-to-vehicle safety beaconing over a dedicated ad-hoc DSRC
# (802.11p / OCB) interface. Beacons travel car-to-car with no RSU/AP in the
# path, so this genuinely exercises V2V (unlike the STA-mode wlan[0] DSRC leg,
# which associates to roadside RSUs for V2I). The app records V2V KPIs:
# neighbour count, beacon reception ratio, inter-vehicle latency and beacon load.
[Config V2V]
extends = MultiRatHighway_Base
description = "Highway V2V safety beaconing over ad-hoc DSRC (802.11p/OCB)"

# Dedicated ad-hoc DSRC NIC (wlan[2]), separate from the STA-mode wlan[0] (V2I).
*.car[*].numWlanInterfaces = 3
*.car[*].wlan[2].opMode = "p"
*.car[*].wlan[2].mgmt.typename = "Ieee80211MgmtAdhoc"
*.car[*].wlan[2].agent.typename = ""
*.car[*].wlan[2].radio.radioMediumModule = "dsrcMedium"
*.car[*].wlan[2].radio.centerFrequency = 5.9GHz
*.car[*].wlan[2].radio.bandwidth = 10MHz

# V2V beacon app = app[2]; the safety and infotainment apps stay on app[0] and app[1].
*.car[*].numApps = 3
*.car[*].app[2].typename = "multiratvanet.V2vBeaconApp"
*.car[*].app[2].interfaceTableModule = "^.interfaceTable"
*.car[*].app[2].v2vInterface = "wlan2"
*.car[*].app[2].groupAddress = "224.0.0.42"
*.car[*].app[2].localPort = 9001
*.car[*].app[2].destPort = 9001
*.car[*].app[2].beaconInterval = 0.1s
*.car[*].app[2].beaconBytes = 200B
*.car[*].app[2].startTime = 3s
*.car[*].app[2].neighborTimeout = 1s

*.car[*].app[2].**.result-recording-modes = default


# =============================== C-V2X (sidelink) =========================== #
# Direct vehicle-to-vehicle over the 5G-NR PC5 sidelink, modelled with Simu5G's
# network-assisted D2D. Every car broadcasts CAM-like alert messages to the V2X
# multicast group (224.0.0.10) over the sidelink and receives its neighbours'
# alerts. Sidelink D2D links up cars served by the same gNodeB (NR sidelink
# Mode 1 / network-scheduled). To match Simu5G's proven D2D multicast setup the
# sidelink is the sole traffic here (no Uu V2N flow, which otherwise saturates
# the shared NR MAC HARQ). The Simu5G Alert apps record the C-V2X KPIs: messages
# sent, messages received and end-to-end sidelink delay.
[Config CV2X]
extends = MultiRatHighway_Base
description = "Highway C-V2X safety broadcast over 5G-NR PC5 sidelink (D2D multicast)"

# --- Enable D2D / sidelink on the gNodeBs and the cars --------------------- #
**.amcMode = "D2D"

# One-to-many sidelink uses a fixed CQI (no CQI feedback for multicast flows).
**.enableD2DCqiReporting = false
**.usePreconfiguredTxParams = true
**.d2dCqi = 7

# Enrol the cellular ("wlan") interface of every car in the V2X multicast group
# (HostAutoConfigurator reads this instead of demo.xml for dynamic Veins cars).
*.car[*].configurator.mcastGroups = "224.0.0.10"

# --- App layer: C-V2X sender = app[0], receiver = app[1] (replaces V2N) ------
*.car[*].numApps = 2

# CAM-like transmitter broadcasting to the sidelink multicast group.
*.car[*].app[0].typename = "simu5g.apps.alert.AlertSender"
*.car[*].app[0].interfaceTableModule = "^.interfaceTable"
*.car[*].app[0].multicastInterface = "wlan"
*.car[*].app[0].destAddress = "224.0.0.10"
*.car[*].app[0].destPort = 1000
*.car[*].app[0].localPort = 3088
*.car[*].app[0].startTime = uniform(3s, 3.1s)
*.car[*].app[0].period = 0.1s
*.car[*].app[0].packetSize = 200

# Receiver listening on the sidelink multicast group.
*.car[*].app[1].typename = "simu5g.apps.alert.AlertReceiver"
*.car[*].app[1].interfaceTableModule = "^.interfaceTable"
*.car[*].app[1].multicastInterface = "wlan"
*.car[*].app[1].localPort = 1000

*.car[*].app[0].**.result-recording-modes = default
*.car[*].app[1].**.result-recording-modes = default


# ========================= URBAN GRID SCENARIOS ============================= #
# Dense urban environment: 5x5 block grid (2km x 2km), 40 vehicles, 10 WiFi APs,
# 10 DSRC RSUs, single 5G gNodeB. Studies multi-RAT switching in congested urban
# settings with frequent overlapping coverage zones and dense handover activity.
# Recommended for ML/FL controller training and dense network studies.

[Config UrbanGrid_Base]
description = "Urban grid base: 5x5 blocks, 40 vehicles, 10 APs/RSUs, 2km x 2km"
network = multiratvanet.simulations.MultiRatUrbanGrid

# Override Veins/SUMO configuration for urban grid
*.veinsManager.launchConfig = xmldoc("scenarios/urbangrid/UrbanGrid.launchd.xml")

# Dense urban setting: more aggressive coverage overlap
sim-time-limit = 120s
*.*.numCars = 40

# Urban infrastructure positions: 10 WiFi APs distributed across the grid
*.wifiAp[0].mobility.initialX = 400m
*.wifiAp[0].mobility.initialY = 400m
*.wifiAp[1].mobility.initialX = 800m
*.wifiAp[1].mobility.initialY = 400m
*.wifiAp[2].mobility.initialX = 1200m
*.wifiAp[2].mobility.initialY = 400m
*.wifiAp[3].mobility.initialX = 1600m
*.wifiAp[3].mobility.initialY = 400m
*.wifiAp[4].mobility.initialX = 400m
*.wifiAp[4].mobility.initialY = 1000m
*.wifiAp[5].mobility.initialX = 800m
*.wifiAp[5].mobility.initialY = 1000m
*.wifiAp[6].mobility.initialX = 1200m
*.wifiAp[6].mobility.initialY = 1000m
*.wifiAp[7].mobility.initialX = 1600m
*.wifiAp[7].mobility.initialY = 1000m
*.wifiAp[8].mobility.initialX = 1000m
*.wifiAp[8].mobility.initialY = 1500m
*.wifiAp[9].mobility.initialX = 1000m
*.wifiAp[9].mobility.initialY = 500m
*.wifiAp[*].mobility.initialZ = 0m
*.wifiAp[*].mobility.typename = "StationaryMobility"
*.wifiAp[*].mobility.initFromDisplayString = false

# Urban DSRC RSU positions: 10 RSUs on main arterials
*.dsrcRsu[0].mobility.initialX = 200m
*.dsrcRsu[0].mobility.initialY = 200m
*.dsrcRsu[1].mobility.initialX = 600m
*.dsrcRsu[1].mobility.initialY = 300m
*.dsrcRsu[2].mobility.initialX = 1000m
*.dsrcRsu[2].mobility.initialY = 250m
*.dsrcRsu[3].mobility.initialX = 1400m
*.dsrcRsu[3].mobility.initialY = 350m
*.dsrcRsu[4].mobility.initialX = 1800m
*.dsrcRsu[4].mobility.initialY = 300m
*.dsrcRsu[5].mobility.initialX = 400m
*.dsrcRsu[5].mobility.initialY = 800m
*.dsrcRsu[6].mobility.initialX = 1000m
*.dsrcRsu[6].mobility.initialY = 900m
*.dsrcRsu[7].mobility.initialX = 1600m
*.dsrcRsu[7].mobility.initialY = 850m
*.dsrcRsu[8].mobility.initialX = 800m
*.dsrcRsu[8].mobility.initialY = 1400m
*.dsrcRsu[9].mobility.initialX = 1400m
*.dsrcRsu[9].mobility.initialY = 1500m
*.dsrcRsu[*].mobility.initialZ = 0m
*.dsrcRsu[*].mobility.typename = "StationaryMobility"
*.dsrcRsu[*].mobility.initFromDisplayString = false

# Urban coverage: buildings block signal, shorter ranges
*.car[*].ratCoverageMonitor.dsrcRange = 200m
*.car[*].ratCoverageMonitor.wifiRange = 150m
*.car[*].ratCoverageMonitor.dsrcRssiThreshold = -85dBm
*.car[*].ratCoverageMonitor.wifiRssiThreshold = -80dBm
*.car[*].ratCoverageMonitor.lteRange = 1200m

# Urban scenario: faster decision-making (dense handover environment)
*.car[*].multiRatAppManager.decisionInterval = 0.3s

# 5G gNodeB central placement (covers whole urban area)
*.gNodeB.mobility.initialX = 1000m
*.gNodeB.mobility.initialY = 1000m
*.gNodeB.mobility.initialZ = 30m
*.gNodeB.mobility.typename = "StationaryMobility"

# Server location (central)
*.server.ipv4.ip = "10.0.0.1"


[Config UrbanGrid_CoveragePriority]
extends = UrbanGrid_Base
description = "Urban grid with CoveragePriority RAT selection (DSRC>WiFi>NR>LTE)"
*.car[*].multiRatAppManager.policy = "CoveragePriority"


[Config UrbanGrid_Ensemble]
extends = UrbanGrid_Base
description = "Urban grid with Ensemble voting (balanced multi-objective)"
*.car[*].multiRatAppManager.policy = "Ensemble"
*.car[*].multiRatAppManager.ensembleWeightCoverage = 1.0
*.car[*].multiRatAppManager.ensembleWeightSinr     = 1.5
*.car[*].multiRatAppManager.ensembleWeightLatency  = 1.5
*.car[*].multiRatAppManager.ensembleWeightLoad     = 1.0
*.car[*].multiRatAppManager.ensembleStickiness     = 2.0  # More stable in dense urban


[Config UrbanGrid_ML]
extends = UrbanGrid_Base
description = "Urban grid with ML/FL policy hook (for learning-based controllers)"
*.car[*].multiRatAppManager.policy = "Ml"
# When using external learning agent, provide metrics snapshot here
*.car[*].multiRatAppManager.decisionInterval = 0.2s  # Faster for agent training


[Config UrbanGrid_Dense]
extends = UrbanGrid_Ensemble
description = "Even denser urban grid: 60 vehicles, higher interference"
*.*.numCars = 60
sim-time-limit = 120s
# More aggressive hysteresis to prevent ping-pong in high-density scenario
*.car[*].multiRatAppManager.ensembleStickiness = 3.0


# ========================= ELECTRONIC CITY SCENARIOS ======================== #
# Real-world urban topology from OpenStreetMap (Bangalore), 1000 second duration.
# Dense metropolitan area with 3 distributed 5G gNodeBs, 15 WiFi APs, 15 DSRC RSUs.
# Ideal for long-duration studies, interference analysis, and realistic urban dynamics.
# Recommended for comprehensive handover evaluation and policy stability testing.

[Config ElectronicCity_Base]
description = "ElectronicCity base: OSM Bangalore, 1000s, 15 APs/RSUs, 3 gNodeBs"
network = multiratvanet.simulations.ElectronicCity

# Override Veins/SUMO configuration for ElectronicCity
*.veinsManager.launchConfig = xmldoc("scenarios/electroniccity/ElectronicCity.launchd.xml")

# Realistic longer urban scenario
sim-time-limit = 1000s
*.*.numCars = 50

# ElectronicCity is a large real-world OSM-based area, so playground needs to be larger
*.playgroundSizeX = 5000m
*.playgroundSizeY = 5000m
*.playgroundSizeZ = 50m

# ElectronicCity infrastructure positions (distributed across OSM-based area)
# 15 WiFi APs spread across the city
*.wifiAp[0].mobility.initialX = 500m
*.wifiAp[0].mobility.initialY = 500m
*.wifiAp[1].mobility.initialX = 1200m
*.wifiAp[1].mobility.initialY = 600m
*.wifiAp[2].mobility.initialX = 1800m
*.wifiAp[2].mobility.initialY = 700m
*.wifiAp[3].mobility.initialX = 2400m
*.wifiAp[3].mobility.initialY = 800m
*.wifiAp[4].mobility.initialX = 3000m
*.wifiAp[4].mobility.initialY = 900m
*.wifiAp[5].mobility.initialX = 600m
*.wifiAp[5].mobility.initialY = 1500m
*.wifiAp[6].mobility.initialX = 1500m
*.wifiAp[6].mobility.initialY = 1600m
*.wifiAp[7].mobility.initialX = 2400m
*.wifiAp[7].mobility.initialY = 1700m
*.wifiAp[8].mobility.initialX = 3300m
*.wifiAp[8].mobility.initialY = 1800m
*.wifiAp[9].mobility.initialX = 900m
*.wifiAp[9].mobility.initialY = 2500m
*.wifiAp[10].mobility.initialX = 2100m
*.wifiAp[10].mobility.initialY = 2600m
*.wifiAp[11].mobility.initialX = 3300m
*.wifiAp[11].mobility.initialY = 2700m
*.wifiAp[12].mobility.initialX = 1200m
*.wifiAp[12].mobility.initialY = 3500m
*.wifiAp[13].mobility.initialX = 2400m
*.wifiAp[13].mobility.initialY = 3600m
*.wifiAp[14].mobility.initialX = 3600m
*.wifiAp[14].mobility.initialY = 3700m
*.wifiAp[*].mobility.initialZ = 0m
*.wifiAp[*].mobility.typename = "StationaryMobility"
*.wifiAp[*].mobility.initFromDisplayString = false

# 15 DSRC RSUs distributed across main roads
*.dsrcRsu[0].mobility.initialX = 300m
*.dsrcRsu[0].mobility.initialY = 400m
*.dsrcRsu[1].mobility.initialX = 1000m
*.dsrcRsu[1].mobility.initialY = 500m
*.dsrcRsu[2].mobility.initialX = 1600m
*.dsrcRsu[2].mobility.initialY = 600m
*.dsrcRsu[3].mobility.initialX = 2200m
*.dsrcRsu[3].mobility.initialY = 700m
*.dsrcRsu[4].mobility.initialX = 2900m
*.dsrcRsu[4].mobility.initialY = 800m
*.dsrcRsu[5].mobility.initialX = 400m
*.dsrcRsu[5].mobility.initialY = 1400m
*.dsrcRsu[6].mobility.initialX = 1300m
*.dsrcRsu[6].mobility.initialY = 1500m
*.dsrcRsu[7].mobility.initialX = 2200m
*.dsrcRsu[7].mobility.initialY = 1600m
*.dsrcRsu[8].mobility.initialX = 3200m
*.dsrcRsu[8].mobility.initialY = 1700m
*.dsrcRsu[9].mobility.initialX = 700m
*.dsrcRsu[9].mobility.initialY = 2400m
*.dsrcRsu[10].mobility.initialX = 1900m
*.dsrcRsu[10].mobility.initialY = 2500m
*.dsrcRsu[11].mobility.initialX = 3100m
*.dsrcRsu[11].mobility.initialY = 2600m
*.dsrcRsu[12].mobility.initialX = 1000m
*.dsrcRsu[12].mobility.initialY = 3400m
*.dsrcRsu[13].mobility.initialX = 2200m
*.dsrcRsu[13].mobility.initialY = 3500m
*.dsrcRsu[14].mobility.initialX = 3400m
*.dsrcRsu[14].mobility.initialY = 3600m
*.dsrcRsu[*].mobility.initialZ = 0m
*.dsrcRsu[*].mobility.typename = "StationaryMobility"
*.dsrcRsu[*].mobility.initFromDisplayString = false

# Multiple 5G gNodeB positions (distributed coverage)
**.gNodeB1.mobility.initialX = 800m
**.gNodeB1.mobility.initialY = 800m
**.gNodeB1.mobility.initialZ = 30m
**.gNodeB1.mobility.typename = "StationaryMobility"
**.gNodeB2.mobility.initialX = 2200m
**.gNodeB2.mobility.initialY = 2200m
**.gNodeB2.mobility.initialZ = 30m
**.gNodeB2.mobility.typename = "StationaryMobility"
**.gNodeB3.mobility.initialX = 3400m
**.gNodeB3.mobility.initialY = 3400m
**.gNodeB3.mobility.initialZ = 30m
**.gNodeB3.mobility.typename = "StationaryMobility"
**.gNodeB3.macCellId = 3
**.gNodeB3.macNodeId = 3
**.gNodeB3.numX2Apps = 0

# ElectronicCity coverage: realistic urban propagation (more blocking)
*.car[*].ratCoverageMonitor.dsrcRange = 250m
*.car[*].ratCoverageMonitor.wifiRange = 180m
*.car[*].ratCoverageMonitor.dsrcRssiThreshold = -85dBm
*.car[*].ratCoverageMonitor.wifiRssiThreshold = -80dBm
*.car[*].ratCoverageMonitor.nrRange = 800m
*.car[*].ratCoverageMonitor.lteRange = 1500m

# ElectronicCity scenario: standard decision interval (long scenario for training)
*.car[*].multiRatAppManager.decisionInterval = 0.5s

# Large OSM map can transiently exceed strict ITU path-loss model distance ranges.
# Keep simulation running by tolerating max-distance violations in LTE/NR channel models.
**.cellularNic.channelModel[*].tolerateMaxDistViolation = true
**.cellularNic.nrChannelModel[*].tolerateMaxDistViolation = true


[Config ElectronicCity_CoveragePriority]
extends = ElectronicCity_Base
description = "ElectronicCity with CoveragePriority RAT selection"
*.car[*].multiRatAppManager.policy = "CoveragePriority"


[Config ElectronicCity_Ensemble]
extends = ElectronicCity_Base
description = "ElectronicCity with Ensemble voting (balanced multi-objective)"
*.car[*].multiRatAppManager.policy = "Ensemble"
*.car[*].multiRatAppManager.ensembleWeightCoverage = 1.0
*.car[*].multiRatAppManager.ensembleWeightSinr     = 1.5
*.car[*].multiRatAppManager.ensembleWeightLatency  = 1.5
*.car[*].multiRatAppManager.ensembleWeightLoad     = 1.0
*.car[*].multiRatAppManager.ensembleStickiness     = 2.5  # Stability in large real-world scenario


[Config ElectronicCity_ML]
extends = ElectronicCity_Base
description = "ElectronicCity with ML/FL policy hook (long-duration learning)"
*.car[*].multiRatAppManager.policy = "Ml"
# Longer scenario: ideal for FL agent training and convergence analysis
*.car[*].multiRatAppManager.decisionInterval = 0.3s


[Config ElectronicCity_Dense]
extends = ElectronicCity_Ensemble
description = "ElectronicCity dense variant: 80 vehicles, higher congestion"
*.*.numCars = 80
sim-time-limit = 1000s
# Increase hysteresis to prevent oscillations in very dense scenario
*.car[*].multiRatAppManager.ensembleStickiness = 3.5
**.sameTransmissionStartTimeCheck = "ignore"
