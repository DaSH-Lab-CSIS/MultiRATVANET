# Multiple 5G gNodeB positions (distributed coverage)
**.gNodeB1.mobility.initialX = 5926m
**.gNodeB1.mobility.initialY = 6142m
**.gNodeB1.mobility.initialZ = 30m
**.gNodeB1.mobility.typename = "StationaryMobility"
**.gNodeB2.mobility.initialX = 5056m
**.gNodeB2.mobility.initialY = 7163m
**.gNodeB2.mobility.initialZ = 30m
**.gNodeB2.mobility.typename = "StationaryMobility"
**.gNodeB3.mobility.initialX = 4236m
**.gNodeB3.mobility.initialY = 6069m
**.gNodeB3.mobility.initialZ = 30m
**.gNodeB3.mobility.typename = "StationaryMobility"
# without this the coordinates above are ignored and the gNodeBs sit at their display-string positions
**.gNodeB*.mobility.initFromDisplayString = false
**.gNodeB3.macCellId = 3
**.gNodeB3.macNodeId = 3
# Cars stay on the cell they first attach to, as in CV2X. With many cars changing cell, Simu5G
# 1.7's gNodeB downlink scheduler counts SDUs a car's queue no longer holds and stops the run
# ("Abnormal queue length detected while building MAC PDU", NrMacGnb). A car that leaves its cell
# loses 5G coverage; the same for every policy.
*.car[*].cellularNic.rrc.nrHandoverController.enableHandover = false
*.gNodeB*.cellularNic.phy.enableHandover = false
# X2 mesh: every gNodeB peers with the other two (as Simu5G's MultiCell_X2Mesh). A handover to
# or from a gNodeB without X2 stops the run (x2Out[] gate out of range in LteX2Manager).
*.gNodeB*.numX2Apps = 2
*.gNodeB1.x2App[0].client.connectAddress = "gNodeB2%x2ppp0"
*.gNodeB1.x2App[1].client.connectAddress = "gNodeB3%x2ppp1"
*.gNodeB2.x2App[0].client.connectAddress = "gNodeB1%x2ppp0"
*.gNodeB2.x2App[1].client.connectAddress = "gNodeB3%x2ppp0"
*.gNodeB3.x2App[0].client.connectAddress = "gNodeB2%x2ppp1"
*.gNodeB3.x2App[1].client.connectAddress = "gNodeB1%x2ppp1"

# ElectronicCity coverage: realistic urban propagation (more blocking)
*.car[*].ratCoverageMonitor.dsrcRange = 250m
*.car[*].ratCoverageMonitor.wifiRange = 180m
*.car[*].ratCoverageMonitor.dsrcRssiThreshold = -85dBm
*.car[*].ratCoverageMonitor.wifiRssiThreshold = -80dBm
*.car[*].ratCoverageMonitor.nrRange = 800m

# ElectronicCity scenario: standard decision interval (long scenario for training)
*.car[*].multiRatAppManager.decisionInterval = 0.5s

# Large OSM map can transiently exceed strict ITU path-loss model distance ranges.
# Keep simulation running by tolerating max-distance violations in LTE/NR channel models.
**.cellularNic.channelModel[*].tolerateMaxDistViolation = true
**.cellularNic.nrChannelModel[*].tolerateMaxDistViolation = true


