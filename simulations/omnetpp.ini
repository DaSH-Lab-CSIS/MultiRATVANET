# NOTE: same 40 vehicles as UrbanGrid_Ensemble (the count comes from the SUMO route file);
# only the stickiness differs. A denser variant needs its own route file.
[Config UrbanGrid_Dense]
extends = UrbanGrid_Ensemble
description = "Urban grid, Ensemble with higher stickiness (same 40 vehicles; a denser variant needs a denser SUMO route file)"
sim-time-limit = 120s
# More aggressive hysteresis to prevent ping-pong
*.car[*].multiRatAppManager.ensembleStickiness = 3.0


# ========================= ELECTRONIC CITY SCENARIOS ======================== #
# Real-world urban topology from OpenStreetMap (Bangalore), 1000 second duration.
# Dense metropolitan area with 3 distributed 5G gNodeBs, 15 WiFi APs, 15 DSRC RSUs.
# Ideal for long-duration studies, interference analysis, and realistic urban dynamics.
# Recommended for comprehensive handover evaluation and policy stability testing.

[Config ElectronicCity_Base]
description = "ElectronicCity base: OSM Bangalore, 1000s, 15 APs/RSUs, 3 gNodeBs"
# Infrastructure sits where the cars drive (SUMO traffic is the same for every policy): gNodeBs at
# the 3 k-means centres of car positions, RSUs and APs alternately at the 30 busiest 100 m cells
# at least 400 m apart (positions from 300 s of traffic, seeds 0-2; frame = Veins/OMNeT++).
# The playground covers the whole SUMO network (8.45 x 9.58 km).
network = multiratvanet.simulations.ElectronicCity

# Override Veins/SUMO configuration for ElectronicCity
*.veinsManager.launchConfig = xmldoc("scenarios/electroniccity/ElectronicCity.launchd.xml")

# Realistic longer urban scenario
sim-time-limit = 1000s

# ElectronicCity is a large real-world OSM-based area, so playground needs to be larger
*.playgroundSizeX = 9000m
*.playgroundSizeY = 10000m
*.playgroundSizeZ = 50m

# ElectronicCity infrastructure positions (distributed across OSM-based area)
# 15 WiFi APs spread across the city
*.wifiAp[0].mobility.initialX = 5250m
*.wifiAp[0].mobility.initialY = 5650m
*.wifiAp[1].mobility.initialX = 5950m
*.wifiAp[1].mobility.initialY = 6550m
*.wifiAp[2].mobility.initialX = 5850m
*.wifiAp[2].mobility.initialY = 5750m
*.wifiAp[3].mobility.initialX = 4850m
*.wifiAp[3].mobility.initialY = 5950m
*.wifiAp[4].mobility.initialX = 5650m
*.wifiAp[4].mobility.initialY = 7250m
*.wifiAp[5].mobility.initialX = 4450m
