*.wifiAp[6].mobility.initialX = 5250m
*.wifiAp[6].mobility.initialY = 6150m
*.wifiAp[7].mobility.initialX = 5550m
*.wifiAp[7].mobility.initialY = 6750m
*.wifiAp[8].mobility.initialX = 4650m
*.wifiAp[8].mobility.initialY = 7150m
*.wifiAp[9].mobility.initialX = 4850m
*.wifiAp[9].mobility.initialY = 7750m
*.wifiAp[10].mobility.initialX = 6250m
*.wifiAp[10].mobility.initialY = 7950m
*.wifiAp[11].mobility.initialX = 3550m
*.wifiAp[11].mobility.initialY = 6950m
*.wifiAp[12].mobility.initialX = 5950m
*.wifiAp[12].mobility.initialY = 6950m
*.wifiAp[13].mobility.initialX = 5750m
*.wifiAp[13].mobility.initialY = 6150m
